[[cite]]
key   = "kirk2023rlhf"
arxiv = "2310.06452"
claim = "SFT-vs-RLHF per-input diversity finding. Verified 2026-04-24: §5.2 K=16 samples/prompt, three diversity metrics (distinct-N with EAD de-biasing per Liu 2022, SentBERT, NLI) — not four. The diversity finding is on TL;DR summarisation only; §6.2 explicitly says no meaningful differences on AlpacaFarm so they dropped it. Kirk et al. report means ± std across prompts (Figs. 5–6 captions), no formal significance tests; we upgrade to paired Wilcoxon per Dror 2018 + Bonferroni per Dror 2017."

