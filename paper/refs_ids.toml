arxiv = "2504.20073"
claim = "RAGEN / StarPO: multi-turn RL training framework for LLM agents. Observes 'Echo Trap' collapse pattern (diverse-then-deterministic) during training; uses within-prompt reward standard deviation as an early-warning signal for collapse; also tracks rollout-level output entropy. Finding 1 (Echo Trap); Finding 2 / §3 (StarPO-S uncertainty-based trajectory filtering by reward std). Example of work that observes LLM output-distribution collapse but measures it via task-outcome variance rather than a principled text-level diversity metric."

