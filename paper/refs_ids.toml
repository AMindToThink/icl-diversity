# Source of truth for all paper citations.
#
# Each [[cite]] entry specifies a BibTeX key and ONE authoritative identifier
# (arxiv, doi, or acl). `scripts/build_bib.py` resolves each identifier by
# hitting the arXiv API / Crossref / ACL Anthology and writes
# paper/refs.bib. The .tex file never hand-types author lists or titles —
# that is what this file exists to prevent.
#
# Manual entries (for papers with no stable digital identifier) set
# `manual = true` and embed the BibTeX verbatim. Use sparingly; each manual
# entry is a source of the hallucination risk this system is designed to
# remove.
#
# Identifier precedence when more than one is present:
#   acl > doi > arxiv > manual
# (ACL Anthology entries are already in @inproceedings form with the
# canonical published venue; DOIs resolve to peer-reviewed records;
# arXiv is the preprint fallback.)
#
# After editing this file:
#   uv run python scripts/build_bib.py       # regenerate paper/refs.bib
#   uv run python scripts/verify_cites.py    # lint \cite{...} keys
#
# See paper/CITATIONS.md for the workflow rationale and background.

[[cite]]
key   = "du2019boosting"
acl   = "P19-1005"
claim = "Earliest unambiguous instance of a scalar sentence-embedding-based diversity metric for generated text: §4.1 computes k-means over word-averaged (Arora 2017 SIF) sentence embeddings of dialog responses and reports cluster inertia as the diversity score (Figure 1(d)). Tevet and Berant (2021, §2) treat them as the canonical originator and cite no earlier source. Per subagent literature archaeology 2026-04-24: ~10 earlier candidates checked (Li 2015/2016, Serban 2017, Cao-Clark 2017, Zhao-Zhao-Eskenazi 2017, Forgues 2014, Gimpel 2013, Texygen 2018, Ippolito 2019, Larson 2019), none use embedding-based diversity on generated text as a scalar metric; they use n-gram diversity or embedding-based quality/recall, not embedding-based diversity. Note: Du & Black's method also uses mutual-information decoding (Li et al. 2016 MMI) as one base learner in its boosting ensemble — i.e. they combine pairwise query-response MI (training-time) with an embedding-based diversity *evaluation*, both of which our work contrasts against."

# --- Added 2026-04-24: prior work on MI-for-diversity in dialog generation.
# Both treat MI between query and response as a training/decoding objective
# to avoid generic responses, using pairwise MI (X,Y) where X is the input
# message and Y is the response. Our paper uses MI in a different
# construction: among responses from the same policy (chain-rule conditional
# MI within a response set), as an evaluation-time diagnostic rather than a
# training objective. Li 2016 is the canonical MMI-for-dialog paper that
# Du & Black 2019 build on.

[[cite]]
key   = "li2016diversity"
acl   = "N16-1014"
arxiv = "1510.03055"
claim = "Proposes Maximum Mutual Information (MMI) as the objective function for neural conversation models to promote diverse responses. General MMI definition log p(S,T)/(p(S)p(T)) is Eq. (8); the two operationalized variants are MMI-antiLM (Eq. 9, with tractable decoding form Eq. 14) and MMI-bidi (Eq. 10). These penalize responses with high prior P(Y), reducing 'I don't know'-type generic outputs (abstract + §1, footnote notes 0.45% of OpenSubtitles contain 'I don't know'). Paper's §3 explicitly calls MMI 'pairwise' between source S and target T; no set-level MI is discussed. Used as a decoding criterion (§4.2: 'used the MMI criterion only during testing'). Du & Black 2019 use MMI-decoding as one base learner in their boosting ensemble. Verified 2026-04-24 by verify-citation-claims subagent against https://ar5iv.labs.arxiv.org/html/1510.03055. ALSO originates the distinct-n diversity metric: §5.2 defines distinct-1 and distinct-2 as 'the number of distinct unigrams and bigrams in generated responses... scaled by total number of generated tokens'; cited for n-gram overlap in §10 Related Concepts (verified 2026-04-29 by reading the PDF)."

[[cite]]
key   = "zhang2018aim"
arxiv = "1809.05972"
claim = "Adversarial Information Maximization (AIM) for dialog response generation: §2.1 defines the min-max AIM objective (Eq. 1) as a GAN-style loss plus a variational lower bound on pairwise mutual information I(S;T) between query S and response T, realized via a backward proposal network q_phi(S|T); §2.3 details the VIMO 'Information-promoting objective'. Title and abstract use the framing 'informativeness and diversity'. Published at NeurIPS 2018 (arXiv journal_ref = 'NIPS 2018', pre-rename). Like Li et al. 2016 MMI, treats MI as a training objective at the query-response boundary rather than as a diagnostic on the joint distribution of a policy's response set. Verified 2026-04-24 by verify-citation-claims subagent against https://ar5iv.labs.arxiv.org/html/1809.05972."

